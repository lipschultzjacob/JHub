# This file tells Docker how to run a local Postgres database for
# development. It's local-only -- Railway will host the real database in
# production. "jhub_pg_data" below is a named storage location Docker
# manages for us, which is what keeps your local data around even after you
# stop and restart the database (running `docker compose down -v` instead of
# plain `docker compose down` would delete it).
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: jhub
      POSTGRES_PASSWORD: jhub_dev_password
      POSTGRES_DB: jhub
    ports:
      - "5432:5432"
    volumes:
      - jhub_pg_data:/var/lib/postgresql/data

volumes:
  jhub_pg_data:
